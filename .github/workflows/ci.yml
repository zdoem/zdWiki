name: zdWiki CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Validate Knowledge Schema & Lint
        run: |
          PYTHONPATH=apps/api python -m app.cli.main lint

      - name: Run Pytest Suite
        run: |
          PYTHONPATH=apps/api pytest apps/api/tests -v

  frontend-checks:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build Next.js Web App
        working-directory: apps/web
        run: npm run build
